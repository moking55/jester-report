# Postgres + S3-compatible storage for development and the db/storage tests.
# Ports bind to 127.0.0.1 only; reach them through an SSH tunnel when this runs on another host.
# Credentials here are for local development only.
name: jester-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jester
      POSTGRES_PASSWORD: jester-dev
      POSTGRES_DB: jester
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jester -d jester"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: jester-dev
      RUSTFS_SECRET_KEY: jester-dev-secret
    ports: ["127.0.0.1:9000:9000"]
    volumes: [rustfs-data:/data]
    restart: unless-stopped

volumes:
  postgres-data:
  rustfs-data:
