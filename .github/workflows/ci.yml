name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL and RustFS as in infra/compose.dev.yaml, so the db and storage tests run too.
    # The engine tests need the jester/gotenberg image and are skipped here (GOTENBERG_URL unset).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jester
          POSTGRES_PASSWORD: jester-dev
          POSTGRES_DB: jester
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jester -d jester"
          --health-interval 5s
          --health-retries 20
      rustfs:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: jester-dev
          RUSTFS_SECRET_KEY: jester-dev-secret
        ports: ["9000:9000"]
    env:
      JESTER_TEST_DATABASE_URL: postgresql://jester:jester-dev@127.0.0.1:5432/jester
      JESTER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: Wait for RustFS
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000 && exit 0; sleep 2; done; exit 1
      - run: uv run pytest -q

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
      - name: Types match the contract
        run: npm run gen:api && git diff --exit-code lib/types.gen.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
