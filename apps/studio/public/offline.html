<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jester Studio — ออฟไลน์อยู่</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, sans-serif;
        background: #f2f6fa;
        color: #0d1b33;
      }
      main {
        text-align: center;
        padding: 24px;

        width: 96px;
        height: 96px;
      }
      button {
        font: inherit;
        padding: 6px 16px;
        border: 1px solid #155fa8;
        border-radius: 8px;
        background: #155fa8;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>ออฟไลน์อยู่</h1>
      <p>Jester Studio ต้องต่อเน็ตเพื่อบันทึกและออกเอกสาร ต่อเน็ตแล้วลองใหม่</p>
      <button type="button" onclick="location.reload()">ลองใหม่</button>
    </main>
  </body>
</html>
