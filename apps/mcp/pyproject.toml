[project]
name = "jester-mcp"
version = "1.12.0"
description = "Jester MCP connector for report authoring in claude.ai"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
jester-mcp = "jester_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jester_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live_stack: needs the whole compose stack at JESTER_TEST_API_URL"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]
