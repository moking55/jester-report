openapi: 3.1.0
info:
  title: Jester Report Server API
  version: 1.14.0
  description: |
    The contract of the Jester api. The api itself serves it at `GET /v1/openapi.yaml`, and Studio's
    types and these docs are generated from it.

    Two callers:
    - **External systems** call `POST /v1/render` with an API key (Studio › Settings › API keys),
      sent as `Authorization: Bearer jrk_…`. The answer is the PDF; the `Jester-Run-Id` header names
      the run, so the document can be found in Studio's history. The issue page's
      "สำหรับนักพัฒนา" button builds a ready request (curl, JavaScript, Python) for each report.
    - **Studio** (Next.js server, never the browser) calls everything else with the
      user's session token, server-to-server.

    Conventions:
    - Errors are `application/problem+json` (RFC 9457) with a stable `code`.
    - Single-tenant, every signed-in user has the same rights (intent v1). Objects that
      do not exist and objects the caller cannot see both return 404.
    - Template ids are slugs chosen by the author; versions are integers starting at 1.
    - v1 render is synchronous only; no job queue, no stored PDFs, no Idempotency-Key.
servers:
  - url: '{JESTER_API}'
    description: Your Jester api (JESTER_API in the examples)
    variables:
      JESTER_API: { default: 'http://localhost:8000' }

tags:
  - name: render
  - name: setup
  - name: auth
  - name: users
  - name: api-keys
  - name: templates
  - name: draft
  - name: versions
  - name: runs
  - name: documents
  - name: themes
  - name: tags
  - name: system

security:
  - SessionAuth: []

paths:
  /v1/render:
    post:
      tags: [render]
      operationId: render
      summary: Render a published template version to PDF
      description: |
        Resolves `template.version` to one immutable published version before rendering.
        `"published"` means the version the published alias points to at request time;
        the resolved number is returned in `Jester-Template-Version`. There is no fallback
        to drafts. Data comes only from the caller.

        `?allowEmpty=true` (v1.14) renders a blank form for handwriting: required parameters and
        the schema's `required`/`minItems` are not enforced, a total that cannot be computed from
        what was sent (including a sum of no rows) prints blank instead of `0.00`, and
        `meta.blank` is `true` in the template. Values that are sent are still checked. The render
        is recorded and its document kept like any other; e.g. body
        `{"template": {"id": "quotation", "version": "published"}, "params": {}, "data": {}}`.
      security:
        - ApiKeyAuth: []
        - SessionAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AllowEmpty'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderRequest' }
            example:
              template: { id: quotation, version: published }
              params: { quoteId: Q-DEMO-001, locale: th-TH, docDate: '2026-11-12' }
              data:
                customer: { name: บริษัท ลูกค้า จำกัด }
                discount: '100.70'
                items:
                  - { id: QL01, description: บริการติดตั้งระบบรายงาน, qty: 2, unitPrice: '1250.50' }
                  - { id: QL02, description: ค่าอบรมผู้ใช้งาน, qty: 3, unitPrice: '199.90' }
              filename: Q-DEMO-001.pdf
      responses:
        '200':
          description: PDF
          headers:
            Jester-Run-Id: { $ref: '#/components/headers/RunId' }
            Jester-Template-Version:
              description: Resolved published version number
              schema: { type: integer, minimum: 1 }
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''<filename>` (RFC 6266/8187)'
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`TEMPLATE_NOT_ALLOWED`: this API key may not render this template (same answer whether it exists or not)'
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/template-not-allowed
                title: Template not allowed
                status: 403
                code: TEMPLATE_NOT_ALLOWED
                detail: this API key cannot render this template
                retryable: false
                runId: 019aa61f3c207d3e8a91c0
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/TemplateGone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/InputInvalid' }
        '429':
          description: '`RATE_LIMITED`: the key used up its renders for this minute; `retryable` is true'
          headers:
            Retry-After:
              description: Seconds until the next minute starts
              schema: { type: integer, minimum: 1, maximum: 60 }
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/rate-limited
                title: Rate limited
                status: 429
                code: RATE_LIMITED
                detail: too many renders for this API key; retry later
                retryable: true
              schema: { $ref: '#/components/schemas/Problem' }
        '502': { $ref: '#/components/responses/RenderFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RenderTimeout' }

  /v1/setup:
    get:
      tags: [setup]
      operationId: getSetupStatus
      description: Public. `true` until the first user exists; Studio sends people to the setup page while it is.
      summary: Whether first-run setup is still required
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              example:
                setupRequired: false
              schema:
                type: object
                required: [setupRequired]
                properties:
                  setupRequired: { type: boolean }
    post:
      tags: [setup]
      operationId: completeSetup
      summary: Create the first user with the one-time setup token from the API log
      description: |
        Allowed only while no user exists. The setup token is printed to the `api` container
        log at first start, is single-use, and is discarded once a user exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              setupToken: Qm9vdHN0cmFwVG9rZW4tMDEyMzQ1
              username: somchai
              password: correct-horse-battery
            schema:
              type: object
              required: [setupToken, username, password]
              additionalProperties: false
              properties:
                setupToken: { type: string, minLength: 16 }
                username: { $ref: '#/components/schemas/Username' }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '201':
          description: First user created; returns a session
          content:
            application/json:
              example:
                token: jrs_q8Lk2vXc9TzR4mWb7nYp3sFh6dJg1aEu
                expiresAt: '2026-11-27T09:15:00Z'
                user:
                  id: 3f6c2a1e-8b4d-4c2a-9e1f-7a5b6c8d9e01
                  username: somchai
                  createdAt: '2026-11-01T08:00:00Z'
                  lastLoginAt: '2026-11-20T09:15:00Z'
              schema: { $ref: '#/components/schemas/Session' }
        '403':
          description: Wrong or used setup token
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/setup-token-invalid
                title: Setup token invalid
                status: 403
                code: SETUP_TOKEN_INVALID
                detail: wrong or used setup token
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Setup already completed
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/setup-completed
                title: Setup completed
                status: 409
                code: SETUP_COMPLETED
                detail: setup is already completed
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      description: |
        Returns a session token for Studio's server. Failed attempts are limited per (username, client IP); after too many the answer is 429 for a while.
        `lifetime: long` (30 days idle, at most 90 days) is only for the MCP service: it needs `X-Jester-Studio-Key`, otherwise 422.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: somchai
              password: correct-horse-battery
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
                lifetime:
                  type: string
                  enum: [standard, long]
                  default: standard
                  description: '`long` needs X-Jester-Studio-Key (the MCP service); standard is 12 hours idle, at most 7 days'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              example:
                token: jrs_q8Lk2vXc9TzR4mWb7nYp3sFh6dJg1aEu
                expiresAt: '2026-11-27T09:15:00Z'
                user:
                  id: 3f6c2a1e-8b4d-4c2a-9e1f-7a5b6c8d9e01
                  username: somchai
                  createdAt: '2026-11-01T08:00:00Z'
                  lastLoginAt: '2026-11-20T09:15:00Z'
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }
        '429':
          description: Too many failed attempts
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/rate-limited
                title: Rate limited
                status: 429
                code: RATE_LIMITED
                detail: too many failed attempts; try again later
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: Revokes the session token used for this request. Other sessions of the same user stay valid.
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The signed-in user
      description: The user the session token belongs to.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              example:
                id: 3f6c2a1e-8b4d-4c2a-9e1f-7a5b6c8d9e01
                username: somchai
                createdAt: '2026-11-01T08:00:00Z'
                lastLoginAt: '2026-11-20T09:15:00Z'
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change your own password
      description: |
        Needs the current password. Failed attempts count toward the same per (username, client IP)
        limit as login. On success every other session of this user is revoked; the session used
        for the change stays valid. Forgotten passwords are reset on the server with
        `python -m jester_api.auth reset-password <username>`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              currentPassword: correct-horse-battery
              newPassword: a-longer-better-passphrase
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }
        '429':
          description: Too many failed attempts
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/rate-limited
                title: Rate limited
                status: 429
                code: RATE_LIMITED
                detail: too many failed attempts; try again later
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: Every user. All users have the same rights (single tenant).
      responses:
        '200':
          description: Users
          content:
            application/json:
              example:
              - id: 3f6c2a1e-8b4d-4c2a-9e1f-7a5b6c8d9e01
                username: somchai
                createdAt: '2026-11-01T08:00:00Z'
                lastLoginAt: '2026-11-20T09:15:00Z'
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: The new user signs in with this password and can change it with `changePassword`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: malee
              password: first-password-1234
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { $ref: '#/components/schemas/Username' }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: 8a7b6c5d-4e3f-4a1b-9c8d-7e6f5a4b3c2d
                username: malee
                createdAt: '2026-11-01T08:00:00Z'
                lastLoginAt: null
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Username taken
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: username is taken
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: The last remaining user cannot be deleted.
      responses:
        '204': { description: Deleted; that user's sessions are revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would delete the last user
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: the last user cannot be deleted
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/users/{userId}/password:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [users]
      operationId: setUserPassword
      summary: Set another user's password (they forgot it)
      description: |
        Every session of that user is revoked. Your own password is changed with `changePassword`
        (it needs the current one); sending your own id here is a 422.
      requestBody:
        required: true
        content:
          application/json:
            example:
              newPassword: reset-by-admin-5678
            schema:
              type: object
              required: [newPassword]
              additionalProperties: false
              properties:
                newPassword: { $ref: '#/components/schemas/Password' }
      responses:
        '204': { description: Password set; that user's sessions are revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List API keys
      description: Every key with its limits and last use. The secret is never returned again after `createApiKey`.
      responses:
        '200':
          description: API keys (never includes the secret)
          content:
            application/json:
              example:
              - id: b1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                name: ERP production
                prefix: jrk_5Zq9
                createdAt: '2026-11-20T09:15:00Z'
                createdBy: somchai
                lastUsedAt: null
                expiresAt: '2027-11-20T00:00:00Z'
                templates:
                - quotation
                rateLimitPerMinute: 60
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create an API key for another system
      description: 'The key renders through `POST /v1/render` only. It can be limited to some templates, a number of renders per minute and an expiry time. Keep the `secret`: it is shown once.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: ERP production
              expiresAt: '2027-11-20T00:00:00Z'
              templates:
              - quotation
              rateLimitPerMinute: 60
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                expiresAt:
                  type: string
                  format: date-time
                  description: The key stops working at this time; in the future and at most 5 years away
                templates:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/TemplateId' }
                  description: The only templates this key may render (403 `TEMPLATE_NOT_ALLOWED` otherwise)
                rateLimitPerMinute:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Renders per minute; more get 429 with `Retry-After`
      responses:
        '201':
          description: Created. `secret` is shown only in this response; only its hash is stored.
          content:
            application/json:
              example:
                id: b1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                name: ERP production
                prefix: jrk_5Zq9
                createdAt: '2026-11-20T09:15:00Z'
                createdBy: somchai
                lastUsedAt: null
                expiresAt: '2027-11-20T00:00:00Z'
                templates:
                - quotation
                rateLimitPerMinute: 60
                secret: jrk_5Zq9Wm3xT8vB2nK7cR4yH6pL1dF0gJsA
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string, example: jrk_5Zq9... }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/api-keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Takes effect immediately; documents already issued with the key stay.
      responses:
        '204': { description: Revoked; later requests with it get 401 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      description: Active templates by default, with publish state, the last run and tags. `tag` filters by tags (every one given must match).
      summary: Catalog for the Studio report list
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Also list archived templates
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/TagFilter'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              example:
              - id: quotation
                name: ใบเสนอราคา
                publishedVersion: 3
                latestVersion: 3
                draftRevision: 14
                draftChangedSincePublish: false
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun:
                  id: 019aa61f3c207d3e8a91c0
                  status: succeeded
                  errorCode: null
                  pages: 2
                  createdAt: '2026-11-20T09:15:00Z'
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: null
                archivedBy: null
                tags:
                - ขาย
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [templates]
      operationId: createTemplate
      description: The id is a permanent slug used in `/v1/render`. `starter` fills the draft with a working example; `page` sets the sheet of the blank starter.
      summary: Create a template with an empty or starter draft
      requestBody:
        required: true
        content:
          application/json:
            example:
              id: quotation-2027
              name: ใบเสนอราคา 2027
              starter: blank
              page:
                size: A4
                orientation: portrait
            schema:
              type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/TemplateId' }
                name: { type: string, minLength: 1, maxLength: 120 }
                starter:
                  type: string
                  enum: [blank, quotation, grouped-table, master-detail, tax-invoice]
                  default: blank
                page:
                  $ref: '#/components/schemas/PageSpec'
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: quotation-2027
                name: ใบเสนอราคา 2027
                publishedVersion: null
                latestVersion: null
                draftRevision: 1
                draftChangedSincePublish: true
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun: null
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: null
                archivedBy: null
                tags:
                - ขาย
              schema: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Template id taken
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: a template with this id already exists
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [templates]
      operationId: getTemplate
      summary: One template
      description: The same summary as in `listTemplates`.
      responses:
        '200':
          description: Template
          content:
            application/json:
              example:
                id: quotation
                name: ใบเสนอราคา
                publishedVersion: 3
                latestVersion: 3
                draftRevision: 14
                draftChangedSincePublish: false
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun:
                  id: 019aa61f3c207d3e8a91c0
                  status: succeeded
                  errorCode: null
                  pages: 2
                  createdAt: '2026-11-20T09:15:00Z'
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: null
                archivedBy: null
                tags:
                - ขาย
              schema: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [templates]
      operationId: renameTemplate
      summary: Rename a template
      description: Only the display name changes; the id used in `/v1/render` stays.
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: ใบเสนอราคา (ใหม่)
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              example:
                id: quotation
                name: ใบเสนอราคา (ใหม่)
                publishedVersion: 3
                latestVersion: 3
                draftRevision: 14
                draftChangedSincePublish: false
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun:
                  id: 019aa61f3c207d3e8a91c0
                  status: succeeded
                  errorCode: null
                  pages: 2
                  createdAt: '2026-11-20T09:15:00Z'
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: null
                archivedBy: null
                tags:
                - ขาย
              schema: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/TemplateArchived' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates/import:
    post:
      tags: [templates]
      operationId: importTemplate
      summary: Create a template from a zip, or replace an existing draft with it
      description: |
        The zip is what `exportTemplate` returns: a flat zip with a `jester.json` manifest. The id is
        `templateId` when sent, else the manifest's. A new id creates the template (201). An existing id
        needs `If-Match` with its current draft revision and replaces the whole draft (200); the name,
        versions and published alias stay. The result is always a draft: validate and publish it as usual.
        The body may be up to 26 MB (zip at most 25 MB).
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Draft revision to replace, e.g. `"12"`; required when the template exists
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                templateId: { $ref: '#/components/schemas/TemplateId' }
      responses:
        '200':
          description: The existing draft was replaced
          content:
            application/json:
              example:
                template:
                  id: quotation
                  name: ใบเสนอราคา
                  publishedVersion: 3
                  latestVersion: 3
                  draftRevision: 14
                  draftChangedSincePublish: false
                  page:
                    size: A4
                    orientation: portrait
                    layout: flow
                  lastRun:
                    id: 019aa61f3c207d3e8a91c0
                    status: succeeded
                    errorCode: null
                    pages: 2
                    createdAt: '2026-11-20T09:15:00Z'
                  updatedAt: '2026-11-20T09:15:00Z'
                  archivedAt: null
                  archivedBy: null
                  tags:
                  - ขาย
                revision: 15
                created: false
              schema: { $ref: '#/components/schemas/ImportResult' }
        '201':
          description: A new template was created
          content:
            application/json:
              example:
                template:
                  id: quotation-2027
                  name: ใบเสนอราคา 2027
                  publishedVersion: null
                  latestVersion: null
                  draftRevision: 1
                  draftChangedSincePublish: true
                  page:
                    size: A4
                    orientation: portrait
                    layout: flow
                  lastRun: null
                  updatedAt: '2026-11-20T09:15:00Z'
                  archivedAt: null
                  archivedBy: null
                  tags:
                  - ขาย
                revision: 1
                created: true
              schema: { $ref: '#/components/schemas/ImportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` (exists and no If-Match, or report.json/template.html missing) or `TEMPLATE_ARCHIVED`'
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: the zip has no report.json
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415':
          description: An asset's bytes do not match its extension
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/unsupported-media-type
                title: Unsupported media type
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                detail: logo.png is not a PNG image
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/templates/{templateId}/export:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [templates]
      operationId: exportTemplate
      description: A flat zip with a `jester.json` manifest that `importTemplate` reads back. Use it for backups or to move a report to another Jester.
      summary: Download the draft or one version as a zip
      parameters:
        - name: version
          in: query
          required: false
          description: '`draft` (default) or a version number'
          schema: { type: string, pattern: '^(draft|[1-9][0-9]*)$', default: draft }
      responses:
        '200':
          description: 'Zip; `Content-Disposition` names it `<id>-v<N>.zip` or `<id>-draft-r<revision>.zip`'
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/templates/{templateId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [templates]
      operationId: duplicateTemplate
      summary: Copy a template's draft or one version into a new template
      description: |
        The copy gets a draft at revision 1 and no versions; assets share the stored bytes.
        Archived templates can be copied.
      requestBody:
        required: true
        content:
          application/json:
            example:
              id: quotation-2027
              name: ใบเสนอราคา 2027
              version: 3
            schema:
              type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/TemplateId' }
                name: { type: string, minLength: 1, maxLength: 120 }
                version:
                  description: '`"draft"` (default) or a version number of the source'
                  oneOf:
                    - { const: draft }
                    - { type: integer, minimum: 1 }
                  default: draft
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: quotation-2027
                name: ใบเสนอราคา 2027
                publishedVersion: null
                latestVersion: null
                draftRevision: 1
                draftChangedSincePublish: true
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun: null
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: null
                archivedBy: null
                tags:
                - ขาย
              schema: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Template id taken
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: a template with this id already exists
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/templates/{templateId}/archived:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    put:
      tags: [templates]
      operationId: setTemplateArchived
      summary: Archive or restore a template
      description: |
        An archived template keeps its draft and versions and can still be read, exported and
        duplicated, but cannot be changed (409 `TEMPLATE_ARCHIVED`) or rendered (410). Repeating
        the current state changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            example:
              archived: true
            schema:
              type: object
              required: [archived]
              additionalProperties: false
              properties:
                archived: { type: boolean }
      responses:
        '200':
          description: Template after the change
          content:
            application/json:
              example:
                id: quotation
                name: ใบเสนอราคา
                publishedVersion: 3
                latestVersion: 3
                draftRevision: 14
                draftChangedSincePublish: false
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun:
                  id: 019aa61f3c207d3e8a91c0
                  status: succeeded
                  errorCode: null
                  pages: 2
                  createdAt: '2026-11-20T09:15:00Z'
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: '2026-11-20T09:15:00Z'
                archivedBy: somchai
                tags:
                - ขาย
              schema: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/templates/{templateId}/tags:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    put:
      tags: [templates]
      operationId: setTemplateTags
      summary: Replace the tags of a template (Studio sessions only)
      description: |
        Tags are catalog labels, not part of the report: changing them does not change the draft revision,
        the versions, `draftChangedSincePublish` or the PDF, and an archived template can still be tagged.
        Each tag is trimmed, spaces collapsed, NFC; 1-30 characters, no comma or control characters;
        matching is exact (`VIP` and `vip` differ); duplicates merge; at most 10. The last save wins.
      requestBody:
        required: true
        content:
          application/json:
            example:
              tags:
              - ขาย
              - ' ไตรมาส  4 '
            schema: { $ref: '#/components/schemas/TagList' }
      responses:
        '200':
          description: The tags after normalising
          content:
            application/json:
              example:
                tags:
                - ขาย
                - ไตรมาส 4
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/templates/{templateId}/draft:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [draft]
      operationId: getDraft
      description: Text files come with their content; assets with their metadata only (read the bytes with `getDraftAsset`). `revision` is what `If-Match` needs when changing the draft.
      summary: Draft file list with text contents and asset metadata
      responses:
        '200':
          description: Draft
          content:
            application/json:
              example:
                templateId: quotation
                revision: 14
                basedOnVersion: 3
                files:
                - name: report.json
                  content: "{\n  \"reportVersion\": 1,\n  \"name\": \"ใบเสนอราคา\",\n  \"parameters\": {\"quoteId\": {\"type\": \"string\", \"required\": true}}\n}\n"
                  sha256: 7689c5c76d1bf5f5e99aa708f9fcc3070912a7cd948afc9d2db4260587e45e00
                - name: template.html
                  content: '<h1>ใบเสนอราคา {{ params.quoteId }}</h1>
              
                    '
                  sha256: 6ca7dfbf65170876547eee1c43a8e48241320fdba6ca19a6a26b9041b0755a97
                assets:
                - name: logo.png
                  contentType: image/png
                  size: 18234
                  sha256: ab211233b6576dbb0f8b5826447eeac61e2a833a99ac5d788fbc1a174c3c6ce5
                updatedAt: '2026-11-20T09:15:00Z'
                updatedBy: somchai
              schema: { $ref: '#/components/schemas/Draft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates/{templateId}/draft/files/{fileName}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - name: fileName
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TextFileName' }
    put:
      tags: [draft]
      operationId: putDraftFile
      summary: Create or replace a text file in the draft
      description: |
        `If-Match` with the draft `revision` is required so two Studio tabs cannot silently
        overwrite each other.
      parameters:
        - $ref: '#/components/parameters/IfMatchRevision'
      requestBody:
        required: true
        content:
          text/plain:
            example: "<h1>ใบเสนอราคา {{ params.quoteId }}</h1>\n"
            schema: { type: string, maxLength: 1048576 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              example:
                revision: 15
              schema: { $ref: '#/components/schemas/DraftRevision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/TemplateArchived' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/RevisionRequired' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      tags: [draft]
      operationId: deleteDraftFile
      summary: Delete a text file from the draft
      description: '`report.json` and `template.html` cannot be deleted.'
      parameters:
        - $ref: '#/components/parameters/IfMatchRevision'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              example:
                revision: 16
              schema: { $ref: '#/components/schemas/DraftRevision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Required file, or the template is archived (`TEMPLATE_ARCHIVED`)
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: report.json cannot be deleted
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/RevisionRequired' }

  /v1/templates/{templateId}/draft/assets:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [draft]
      operationId: uploadDraftAsset
      summary: Upload a binary asset (image or font) to object storage and attach it to the draft
      description: |
        Uploaded fonts apply to the body (`template.html`) only. Header/footer templates cannot
        load `@font-face` (spike M0) and only see fonts installed in the `jester/gotenberg` image,
        e.g. TH Sarabun New. `validateDraft` reports `FONT_MISSING` when `header.html` or
        `footer.html` uses a font that is not installed in the image (decision D2).
      parameters:
        - $ref: '#/components/parameters/IfMatchRevision'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
            encoding:
              file:
                contentType: image/png, image/jpeg, image/gif, image/svg+xml, image/webp, image/avif, image/bmp, font/ttf, font/otf
      responses:
        '201':
          description: Stored (content-addressed by sha256; uploading the same bytes is a no-op)
          content:
            application/json:
              example:
                asset:
                  name: logo.png
                  contentType: image/png
                  size: 18234
                  sha256: ab211233b6576dbb0f8b5826447eeac61e2a833a99ac5d788fbc1a174c3c6ce5
                revision: 15
              schema:
                type: object
                required: [asset, revision]
                properties:
                  asset: { $ref: '#/components/schemas/Asset' }
                  revision: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An asset with this name already exists in the draft, or the template is archived (`TEMPLATE_ARCHIVED`)
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: an asset with this name already exists in the draft
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/RevisionRequired' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415':
          description: File type not allowed
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/unsupported-media-type
                title: Unsupported media type
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                detail: only images and TTF/OTF fonts can be uploaded
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/templates/{templateId}/draft/assets/{assetName}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - { name: assetName, in: path, required: true, schema: { $ref: '#/components/schemas/AssetName' } }
    get:
      tags: [draft]
      operationId: getDraftAsset
      summary: The asset's bytes, for Studio's preview of an image or font
      description: |
        Sent with the type detected at upload, `X-Content-Type-Options: nosniff` and a sandboxing
        Content-Security-Policy, so an SVG opened directly cannot run script.
      responses:
        '200':
          description: The bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
            font/ttf: { schema: { type: string, format: binary } }
            font/otf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [draft]
      operationId: deleteDraftAsset
      summary: Detach an asset from the draft
      description: Detaches the asset from the draft. Bytes stay in storage while any published version uses them.
      parameters:
        - $ref: '#/components/parameters/IfMatchRevision'
      responses:
        '200':
          description: Detached
          content:
            application/json:
              example:
                revision: 16
              schema: { $ref: '#/components/schemas/DraftRevision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/TemplateArchived' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/RevisionRequired' }

  /v1/templates/{templateId}/draft/validate:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [draft]
      operationId: validateDraft
      description: Checks report.json, the data schema, expressions, the template, fonts and the sample data. Errors stop a publish; warnings do not.
      summary: Validate the draft definition, template and sample data without rendering
      responses:
        '200':
          description: Validation result (empty `problems` means valid)
          content:
            application/json:
              example:
                valid: false
                revision: 14
                problems:
                - severity: error
                  code: EXPRESSION_INVALID
                  message: unknown function 'sumx'
                  file: report.json
                  line: 12
                  column: 18
                - severity: warning
                  code: FONT_MISSING
                  message: 'footer.html uses a font that is not installed: Kanit'
                  file: footer.html
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/TemplateGone' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates/{templateId}/draft/preview:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [draft]
      operationId: previewDraft
      summary: Render the draft through the same pipeline as /v1/render
      description: |
        Uses the same engine, options and fonts as a real render, plus a DRAFT watermark.
        Without `data`, uses `sampleFile` from the draft (default `sample.json`).
        `?allowEmpty=true` previews the blank form (send `"data": {}`), as in /v1/render.
      parameters:
        - $ref: '#/components/parameters/AllowEmpty'
      requestBody:
        required: false
        content:
          application/json:
            example:
              params:
                quoteId: Q-DEMO-001
                locale: th-TH
                docDate: '2026-11-12'
              sampleFile: sample.json
            schema:
              type: object
              additionalProperties: false
              properties:
                params: { type: object, additionalProperties: true }
                data: {}
                sampleFile: { $ref: '#/components/schemas/TextFileName' }
      responses:
        '200':
          description: PDF preview
          headers:
            Jester-Run-Id: { $ref: '#/components/headers/RunId' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/TemplateGone' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }
        '502': { $ref: '#/components/responses/RenderFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RenderTimeout' }

  /v1/templates/{templateId}/draft/prepared:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [draft]
      operationId: prepareDraft
      summary: The view model the draft's template would receive (data-prep only, no template, no PDF)
      description: |
        Runs data-prep on the draft in the same worker as a render. Without `data`, uses `sampleFile`
        from the draft (default `sample.json`). Decimal numbers come back as decimal strings so nothing
        is rounded on the way (`"3210.00"`). Nothing is recorded in the run history.
        `?allowEmpty=true` prepares the blank form, as in /v1/render (totals that cannot be computed are null).
      parameters:
        - $ref: '#/components/parameters/AllowEmpty'
      requestBody:
        required: false
        content:
          application/json:
            example:
              params:
                quoteId: Q-DEMO-001
                locale: th-TH
                docDate: '2026-11-12'
              data:
                customer:
                  name: บริษัท ลูกค้า จำกัด
                items:
                - id: QL01
                  qty: 2
                  unitPrice: '1250.50'
            schema:
              type: object
              additionalProperties: false
              properties:
                params: { type: object, additionalProperties: true }
                data: {}
                sampleFile: { $ref: '#/components/schemas/TextFileName' }
      responses:
        '200':
          description: The prepared view model
          content:
            application/json:
              example:
                params:
                  quoteId: Q-DEMO-001
                  locale: th-TH
                  docDate: '2026-11-12'
                data:
                  customer:
                    name: บริษัท ลูกค้า จำกัด
                  items:
                  - id: QL01
                    qty: 2
                    unitPrice: '1250.50'
                lists:
                  items:
                    rows:
                    - id: QL01
                      qty: 2
                      unitPrice: '1250.50'
                      amount: '2501.00'
                    groups: []
                totals:
                  subtotal: '2501.00'
                  vat: '175.07'
                  grandTotal: '2676.07'
                problems: []
              schema: { $ref: '#/components/schemas/PreparedData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/TemplateGone' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }
        '502': { $ref: '#/components/responses/RenderFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RenderTimeout' }

  /v1/templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [versions]
      operationId: listVersions
      summary: List published versions
      description: Every frozen version, newest first; `isPublished` marks the one `"published"` renders.
      responses:
        '200':
          description: Published versions, newest first
          content:
            application/json:
              example:
              - templateId: quotation
                version: 3
                publishedAt: '2026-11-20T09:15:00Z'
                publishedBy: somchai
                note: เพิ่มช่องส่วนลด
                sha256: 922071d9af6a96ff42962da121dddbc880ed9462fc854505e66c74c6816682e3
                isPublished: true
              - templateId: quotation
                version: 2
                publishedAt: '2026-11-20T09:15:00Z'
                publishedBy: somchai
                note: null
                sha256: d39c3d992be9d0ade6c2431b49d3bae12a417cc8a067eddbe4c6a3ee8e9154f8
                isPublished: false
              schema:
                type: array
                items: { $ref: '#/components/schemas/Version' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [versions]
      operationId: publishDraft
      summary: Freeze the current draft into a new immutable version and point the published alias at it
      description: Refused when the draft does not validate.
      parameters:
        - $ref: '#/components/parameters/IfMatchRevision'
      requestBody:
        required: false
        content:
          application/json:
            example:
              note: เพิ่มช่องส่วนลด
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Published
          content:
            application/json:
              example:
                templateId: quotation
                version: 3
                publishedAt: '2026-11-20T09:15:00Z'
                publishedBy: somchai
                note: เพิ่มช่องส่วนลด
                sha256: 922071d9af6a96ff42962da121dddbc880ed9462fc854505e66c74c6816682e3
                isPublished: true
              schema: { $ref: '#/components/schemas/Version' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/TemplateArchived' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/RevisionRequired' }
        '422':
          description: Draft does not validate
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/draft-invalid
                title: Draft invalid
                status: 422
                code: DRAFT_INVALID
                detail: the draft does not validate
                retryable: false
                problems:
                - severity: error
                  code: FILE_MISSING
                  message: template.html is not in the draft
                  file: template.html
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/templates/{templateId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [versions]
      operationId: getVersion
      description: The exact files and assets a version renders with. Versions never change.
      summary: Read-only files of a published version
      responses:
        '200':
          description: Version with files
          content:
            application/json:
              example:
                templateId: quotation
                version: 3
                publishedAt: '2026-11-20T09:15:00Z'
                publishedBy: somchai
                note: เพิ่มช่องส่วนลด
                sha256: 922071d9af6a96ff42962da121dddbc880ed9462fc854505e66c74c6816682e3
                isPublished: true
                files:
                - name: report.json
                  content: "{\n  \"reportVersion\": 1,\n  \"name\": \"ใบเสนอราคา\",\n  \"parameters\": {\"quoteId\": {\"type\": \"string\", \"required\": true}}\n}\n"
                  sha256: 7689c5c76d1bf5f5e99aa708f9fcc3070912a7cd948afc9d2db4260587e45e00
                - name: template.html
                  content: '<h1>ใบเสนอราคา {{ params.quoteId }}</h1>
              
                    '
                  sha256: 6ca7dfbf65170876547eee1c43a8e48241320fdba6ca19a6a26b9041b0755a97
                assets:
                - name: logo.png
                  contentType: image/png
                  size: 18234
                  sha256: ab211233b6576dbb0f8b5826447eeac61e2a833a99ac5d788fbc1a174c3c6ce5
              schema:
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - type: object
                    required: [files, assets]
                    properties:
                      files: { type: array, items: { $ref: '#/components/schemas/TextFile' } }
                      assets: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates/{templateId}/published:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    put:
      tags: [versions]
      operationId: setPublishedVersion
      description: 'Renders with `version: "published"` use the new version from the next request. No files change.'
      summary: Roll back or forward by moving the published alias to an existing version
      requestBody:
        required: true
        content:
          application/json:
            example:
              version: 2
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Alias moved
          content:
            application/json:
              example:
                id: quotation
                name: ใบเสนอราคา
                publishedVersion: 2
                latestVersion: 3
                draftRevision: 14
                draftChangedSincePublish: true
                page:
                  size: A4
                  orientation: portrait
                  layout: flow
                lastRun:
                  id: 019aa61f3c207d3e8a91c0
                  status: succeeded
                  errorCode: null
                  pages: 2
                  createdAt: '2026-11-20T09:15:00Z'
                updatedAt: '2026-11-20T09:15:00Z'
                archivedAt: null
                archivedBy: null
                tags:
                - ขาย
              schema: { $ref: '#/components/schemas/TemplateSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/TemplateArchived' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates/{templateId}/draft/reset:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [draft]
      operationId: resetDraftFromVersion
      description: The draft's files and assets become a copy of that version; the draft revision goes up. Versions are untouched.
      summary: Replace the draft with a copy of a published version
      parameters:
        - $ref: '#/components/parameters/IfMatchRevision'
      requestBody:
        required: true
        content:
          application/json:
            example:
              version: 2
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Draft replaced
          content:
            application/json:
              example:
                revision: 15
              schema: { $ref: '#/components/schemas/DraftRevision' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/TemplateArchived' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/RevisionRequired' }

  /v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      description: Every render and preview, newest first, without params or data (only their hashes). Page with `next` as `before`.
