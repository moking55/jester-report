                  color.border: '#d0d7e2'
                  color.text: '#1d2733'
                  color.textMuted: '#5b6b7f'
                  color.primary: '#0b6bcb'
                  color.onPrimary: '#ffffff'
                  color.danger: '#c62828'
                  color.warning: '#b26a00'
                  color.success: '#2e7d32'
                  font.family: Sarabun
                  font.size: 14
                  radius: 6
                  shadow: soft
                  density: comfortable
                createdBy: null
                updatedAt: null
              schema: { $ref: '#/components/schemas/Theme' }
    put:
      tags: [themes]
      operationId: setDefaultTheme
      description: Used on the login and setup pages and by users who have not picked a theme.
      summary: Make a theme the default for everyone
      requestBody:
        required: true
        content:
          application/json:
            example:
              themeId: 6d1f0b9e-2c4a-4e8b-9f3d-1a2b3c4d5e6f
            schema:
              type: object
              required: [themeId]
              additionalProperties: false
              properties:
                themeId: { $ref: '#/components/schemas/ThemeId' }
      responses:
        '200':
          description: The new default theme
          content:
            application/json:
              example:
                id: 6d1f0b9e-2c4a-4e8b-9f3d-1a2b3c4d5e6f
                name: สีองค์กร
                builtIn: false
                tokens:
                  color.background: '#f5f7fa'
                  color.surface: '#ffffff'
                  color.surfaceAlt: '#eef2f7'
                  color.border: '#d0d7e2'
                  color.text: '#1d2733'
                  color.textMuted: '#5b6b7f'
                  color.primary: '#0b6bcb'
                  color.onPrimary: '#ffffff'
                  color.danger: '#c62828'
                  color.warning: '#b26a00'
                  color.success: '#2e7d32'
                  font.family: Sarabun
                  font.size: 14
                  radius: 6
                  shadow: soft
                  density: comfortable
                createdBy: somchai
                updatedAt: '2026-11-20T09:15:00Z'
              schema: { $ref: '#/components/schemas/Theme' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/themes/{themeId}:
    parameters:
      - { name: themeId, in: path, required: true, schema: { $ref: '#/components/schemas/ThemeId' } }
    put:
      tags: [themes]
      operationId: updateTheme
      description: Replaces the whole theme; send every token.
      summary: Replace a theme's name and tokens (built-in themes are 409)
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: สีองค์กร
              tokens:
                color.background: '#f5f7fa'
                color.surface: '#ffffff'
                color.surfaceAlt: '#eef2f7'
                color.border: '#d0d7e2'
                color.text: '#1d2733'
                color.textMuted: '#5b6b7f'
                color.primary: '#0b6bcb'
                color.onPrimary: '#ffffff'
                color.danger: '#c62828'
                color.warning: '#b26a00'
                color.success: '#2e7d32'
                font.family: Sarabun
                font.size: 14
                radius: 6
                shadow: soft
                density: comfortable
            schema: { $ref: '#/components/schemas/ThemeInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              example:
                id: 6d1f0b9e-2c4a-4e8b-9f3d-1a2b3c4d5e6f
                name: สีองค์กร
                builtIn: false
                tokens:
                  color.background: '#f5f7fa'
                  color.surface: '#ffffff'
                  color.surfaceAlt: '#eef2f7'
                  color.border: '#d0d7e2'
                  color.text: '#1d2733'
                  color.textMuted: '#5b6b7f'
                  color.primary: '#0b6bcb'
                  color.onPrimary: '#ffffff'
                  color.danger: '#c62828'
                  color.warning: '#b26a00'
                  color.success: '#2e7d32'
                  font.family: Sarabun
                  font.size: 14
                  radius: 6
                  shadow: soft
                  density: comfortable
                createdBy: somchai
                updatedAt: '2026-11-20T09:15:00Z'
              schema: { $ref: '#/components/schemas/Theme' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Built-in theme, or another theme has that name
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: built-in themes cannot be changed; make a copy instead
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }
    delete:
      tags: [themes]
      operationId: deleteTheme
      description: Users who picked it see the default theme.
      summary: Delete a theme; if it was the default, the default goes back to `mahasamut`
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Built-in theme
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: built-in themes cannot be deleted
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/openapi.yaml:
    get:
      tags: [system]
      operationId: getContract
      description: Public. The single source of these docs and of Studio's generated types.
      summary: This contract (FastAPI's generated docs are turned off because they would not match it)
      security: []
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/yaml:
              schema: { type: string }

  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      description: Public, for load balancers and monitoring. `status` is `down` or `degraded` when a dependency is down, and the answer is then 503.
      security: []
      summary: API, database, object storage and engine status
      responses:
        '200':
          description: Status (also returned with 503 when a dependency is down)
          content:
            application/json:
              example:
                status: up
                version: 1.14.0
                components:
                  database: up
                  objectStorage: up
                  engine:
                    status: up
                    version: 9.4.1
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: A dependency is down
          content:
            application/json:
              example:
                status: degraded
                components:
                  database: up
                  objectStorage: up
                  engine:
                    status: down
                    version: null
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: 'API key created in Studio, sent as `Authorization: Bearer jrk_...`. Only `/v1/render` accepts it.'
    SessionAuth:
      type: http
      scheme: bearer
      description: |
        Session token from `/v1/auth/login` or `/v1/setup`, sent as `Authorization: Bearer jrs_...`
        by the Next.js server. The browser only holds an httpOnly cookie set by Next.js.

  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TemplateId' }
    TagFilter:
      name: tag
      in: query
      required: false
      description: Only items carrying every `tag` given (repeat the parameter); exact match
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    IfMatchRevision:
      name: If-Match
      in: header
      required: true
      description: Draft revision the change is based on, e.g. `"12"`
      schema: { type: string }
    AllowEmpty:
      name: allowEmpty
      in: query
      required: false
      description: |
        `true` = a blank form for handwriting (v1.14): fields left out stay empty, totals that cannot
        be computed are blank, `meta.blank` is `true`. Only `true` or `false`.
      schema: { type: string, enum: ['true', 'false'], default: 'false' }
      example: 'true'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller correlation id; echoed in logs and the run record
      schema: { type: string, maxLength: 128 }

  headers:
    RunId:
      description: Id of the run record (see /v1/runs/{runId})
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/unauthorized
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
            detail: missing, invalid, expired or revoked credentials
            retryable: false
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found (also used for objects the caller cannot see)
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            detail: template not found
            retryable: false
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request exceeds the configured size limit
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/payload-too-large
            title: Payload too large
            status: 413
            code: PAYLOAD_TOO_LARGE
            detail: the request is larger than 10485760 bytes
            retryable: false
          schema: { $ref: '#/components/schemas/Problem' }
    InputInvalid:
      description: Request, params or data failed validation; see `problems`
      content:
        application/problem+json:
          examples:
            params:
              summary: A parameter is missing (render)
              value:
                type: https://jester-report.dev/errors/input-invalid
                title: Input invalid
                status: 422
                code: INPUT_INVALID
                detail: params or data do not fit the template
                retryable: false
                problems:
                - severity: error
                  code: PARAM_REQUIRED
                  message: parameter 'docDate' is required
                  pointer: /params/docDate
                runId: 019aa61f3c207d3e8a91c0
            data:
              summary: A data value breaks data.schema.json (render)
              value:
                type: https://jester-report.dev/errors/input-invalid
                title: Input invalid
                status: 422
                code: INPUT_INVALID
                detail: params or data do not fit the template
                retryable: false
                problems:
                - severity: error
                  code: DATA_INVALID
                  message: '''qty'' is a required property'
                  pointer: /data/items/0
                - severity: error
                  code: DATA_INVALID
                  message: value does not satisfy minimum 1
                  pointer: /data/items/1/qty
                runId: 019aa61f3c207d3e8a91c0
            contract:
              summary: The body does not match this contract
              value:
                type: https://jester-report.dev/errors/input-invalid
                title: Input invalid
                status: 422
                code: INPUT_INVALID
                detail: the request does not match the contract
                retryable: false
                problems:
                - severity: error
                  code: INPUT_INVALID
                  message: Field required
                  pointer: /template
          schema: { $ref: '#/components/schemas/Problem' }
    RevisionRequired:
      description: If-Match with the draft revision is missing
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/revision-required
            title: Revision required
            status: 428
            code: REVISION_REQUIRED
            detail: send If-Match with the draft revision you are changing
            retryable: false
          schema: { $ref: '#/components/schemas/Problem' }
    RevisionConflict:
      description: Draft changed since the given revision; reload and retry
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/revision-conflict
            title: Revision conflict
            status: 412
            code: REVISION_CONFLICT
            detail: the draft changed since this revision; reload and retry
            retryable: false
          schema: { $ref: '#/components/schemas/Problem' }
    RenderFailed:
      description: '`RENDER_RESOURCE_FAILED`, `RENDER_FAILED`, `FONT_MISSING` or `ENGINE_MISCONFIGURED`'
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/render-failed
            title: Render failed
            status: 502
            code: RENDER_FAILED
            detail: the data could not be prepared
            retryable: false
            problems:
            - severity: error
              code: DIVISION_BY_ZERO
              message: division by zero
              file: report.json
            runId: 019aa61f3c207d3e8a91c0
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Engine unreachable or busy; `retryable` is true
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/service-unavailable
            title: Service unavailable
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: too many renders at once; retry shortly
            retryable: true
            runId: 019aa61f3c207d3e8a91c0
          schema: { $ref: '#/components/schemas/Problem' }
    RenderTimeout:
      description: Render exceeded the time limit; `retryable` is true
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/render-timeout
            title: Render timeout
            status: 504
            code: RENDER_TIMEOUT
            detail: preparing the document took too long
            retryable: true
            runId: 019aa61f3c207d3e8a91c0
          schema: { $ref: '#/components/schemas/Problem' }
    TemplateArchived:
      description: '`TEMPLATE_ARCHIVED`: the template is archived; unarchive it to change it'
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/template-archived
            title: Template archived
            status: 409
            code: TEMPLATE_ARCHIVED
            detail: the template is archived; unarchive it to change it
            retryable: false
          schema: { $ref: '#/components/schemas/Problem' }
    TemplateGone:
      description: '`TEMPLATE_ARCHIVED`: the template is archived and cannot be rendered'
      content:
        application/problem+json:
          example:
            type: https://jester-report.dev/errors/template-archived
            title: Template archived
            status: 410
            code: TEMPLATE_ARCHIVED
            detail: the template is archived
            retryable: false
            runId: 019aa61f3c207d3e8a91c0
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    TemplateId:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
      example: quotation
    Username:
      type: string
      pattern: '^[a-zA-Z0-9._-]{3,40}$'
    Password:
      type: string
      minLength: 12
      maxLength: 200
    TextFileName:
      type: string
      description: |
        Basename only; text files of a draft. `index.html` is reserved: the binder generates it
        from `template.html`, and a second file with that name would make every render fail.
      pattern: '^(?!index\.html$)[A-Za-z0-9][A-Za-z0-9._-]{0,99}\.(html|json|css)$'
      example: template.html
    AssetName:
      type: string
      description: Basename only; must not collide with text files or index/header/footer.html
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}\.(png|jpe?g|gif|svg|webp|avif|bmp|ttf|otf)$'

    ErrorCode:
      type: string
      enum:
        - INPUT_INVALID
        - UNAUTHORIZED
        - NOT_FOUND
        - CONFLICT
        - REVISION_CONFLICT
        - REVISION_REQUIRED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - SETUP_COMPLETED
        - SETUP_TOKEN_INVALID
        - DRAFT_INVALID
        - FONT_MISSING
        - RENDER_INPUT_INVALID
        - RENDER_RESOURCE_FAILED
        - RENDER_FAILED
        - RENDER_TIMEOUT
        - SERVICE_UNAVAILABLE
        - ENGINE_MISCONFIGURED
        - INTERNAL_ERROR
        - TEMPLATE_ARCHIVED
        - TEMPLATE_NOT_ALLOWED
    Problem:
      type: object
      description: RFC 9457 problem details plus Jester fields
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, example: 'https://jester-report.dev/errors/input-invalid' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        retryable: { type: boolean, default: false }
        runId: { type: [string, 'null'] }
        problems:
          type: array
          items: { $ref: '#/components/schemas/ValidationProblem' }
    ValidationProblem:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        code:
          type: string
          description: Machine-readable problem code, e.g. `EXPRESSION_INVALID`, `FONT_MISSING`, `FILE_MISSING`
        message: { type: string }
        pointer:
          type: string
          description: JSON Pointer into the request, e.g. `/data/items/0/qty` or `/params/docDate`
        file: { type: string, description: 'Draft file, e.g. `template.html`' }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
    ValidationResult:
      type: object
      required: [valid, problems, revision]
      properties:
        valid: { type: boolean }
        revision: { type: integer }
        problems: { type: array, items: { $ref: '#/components/schemas/ValidationProblem' } }

    RenderRequest:
      type: object
      required: [template, data]
      additionalProperties: false
      properties:
        template:
          type: object
          required: [id, version]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/TemplateId' }
            version:
              description: 'Explicit version number, or `"published"`'
              oneOf:
                - { type: integer, minimum: 1 }
                - { const: published }
        params:
          type: object
          description: Validated against the version's `report.json` parameters
          additionalProperties: true
        data:
          description: |
            Validated against the version's data schema; any JSON value. JSON numbers are parsed
            as exact decimals (never binary floating point), so `1250.5` stays exactly 1250.5.
        filename:
          type: string
          pattern: '^[^\\/"\x00-\x1f\x7f]{1,200}$'
          description: |
            Download name for `Content-Disposition`; defaults to `<templateId>-v<version>.pdf`.
            No slashes, quotes or control characters (incl. line breaks), so a bad name is a 422 instead of a broken header.
        tags:
          allOf:
            - $ref: '#/components/schemas/TagNames'
          description: |
            Tags of the issued document (same rules as `setTemplateTags`; a bad tag is a 422 before anything
            is rendered). Left out, the document starts with a copy of the template's tags at that moment;
            `[]` means no tags. Later changes to the template's tags do not reach documents already issued.

    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: 'Opaque, prefix `jrs_`' }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, 'null'], format: date-time }
    ApiKey:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: 'First characters for identification, e.g. `jrk_5Zq9`' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: null = never expires }
        templates:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/TemplateId' }
          description: null = every template
        rateLimitPerMinute: { type: [integer, 'null'], description: null = no limit }

    PageSpec:
      type: object
      description: >
        report.json `page` (v1.8). Only with the blank starter; a roll or free layout starts without
        header.html and footer.html. A bad combination is 422 INPUT_INVALID.
      additionalProperties: false
      properties:
        size: { type: string, enum: [A3, A4, A5, A6, B5, Letter, Legal, DL, custom, roll], default: A4 }
        orientation: { type: string, enum: [portrait, landscape], default: portrait }
        widthMm: { type: number, minimum: 25, maximum: 1000, description: custom size only }
        heightMm: { type: number, minimum: 25, maximum: 2000, description: custom size only }
        rollWidthMm: { type: integer, enum: [58, 80], description: roll size only }
        layout: { type: string, enum: [flow, free], default: flow }
        marginsMm:
          type: object
          additionalProperties: false
          properties:
            top: { type: number, minimum: 0, maximum: 50 }
            bottom: { type: number, minimum: 0, maximum: 50 }
            left: { type: number, minimum: 0, maximum: 50 }
            right: { type: number, minimum: 0, maximum: 50 }

    TemplateSummary:
      type: object
      required: [id, name, publishedVersion, draftRevision, updatedAt, tags]
      properties:
        id: { $ref: '#/components/schemas/TemplateId' }
        name: { type: string }
        publishedVersion: { type: [integer, 'null'], description: null until first publish }
        latestVersion: { type: [integer, 'null'] }
        draftRevision: { type: integer }
        draftChangedSincePublish: { type: boolean }
        page:
          type: object
          description: the draft's sheet (v1.8); a roll is always portrait and flow
          properties:
            size: { type: string, enum: [A3, A4, A5, A6, B5, Letter, Legal, DL, custom, roll] }
            orientation: { type: string, enum: [portrait, landscape] }
            layout: { type: string, enum: [flow, free] }
            rollWidthMm: { type: integer, enum: [58, 80], description: roll size only }
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/RunSummary'
            - type: 'null'
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time, description: null while active }
        archivedBy: { type: [string, 'null'] }
        tags: { $ref: '#/components/schemas/TagNames' }
    TagNames:
      type: array
      description: Tag names in the order they were given
      maxItems: 10
      items: { type: string, minLength: 1, maxLength: 30 }
    TagColorName:
      type: string
      enum: [gray, red, orange, yellow, green, teal, blue, purple, pink]
    TagColor:
      type: object
      required: [tag, color]
      additionalProperties: false
      properties:
        tag: { type: string, minLength: 1, maxLength: 30 }
        color: { $ref: '#/components/schemas/TagColorName' }
    TagUse:
      type: object
      required: [tag, color, templates, documents]
      properties:
        tag: { type: string }
        color: { $ref: '#/components/schemas/TagColorName' }
        templates: { type: integer, minimum: 0, description: Templates carrying the tag }
        documents: { type: integer, minimum: 0, description: Issued documents carrying the tag }
    TagList:
      type: object
      required: [tags]
      additionalProperties: false
      properties:
        tags: { $ref: '#/components/schemas/TagNames' }
    ImportResult:
      type: object
      required: [template, revision, created]
      properties:
        template: { $ref: '#/components/schemas/TemplateSummary' }
        revision: { type: integer, description: Draft revision after the import }
        created: { type: boolean, description: 'true: a new template; false: an existing draft was replaced' }
    TextFile:
      type: object
      required: [name, content, sha256]
      properties:
        name: { $ref: '#/components/schemas/TextFileName' }
        content: { type: string }
        sha256: { type: string }
    Asset:
      type: object
      required: [name, contentType, size, sha256]
      properties:
        name: { $ref: '#/components/schemas/AssetName' }
        contentType: { type: string }
        size: { type: integer }
        sha256: { type: string }
    Draft:
      type: object
      required: [templateId, revision, files, assets, updatedAt]
      properties:
        templateId: { $ref: '#/components/schemas/TemplateId' }
        revision: { type: integer }
        basedOnVersion: { type: [integer, 'null'] }
        files: { type: array, items: { $ref: '#/components/schemas/TextFile' } }
        assets: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    DraftRevision:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
    Version:
      type: object
      required: [templateId, version, publishedAt, publishedBy, sha256]
      properties:
        templateId: { $ref: '#/components/schemas/TemplateId' }
        version: { type: integer, minimum: 1 }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
        note: { type: [string, 'null'] }
        sha256: { type: string, description: Hash over all files and asset hashes of this version }
        isPublished: { type: boolean, description: True if the published alias points here }

    RunStatus:
      type: string
      enum: [succeeded, failed]
    RunSummary:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        errorCode: { oneOf: [{ $ref: '#/components/schemas/ErrorCode' }, { type: 'null' }] }
        pages: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    Run:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [kind, templateId, caller, hasDocument]
          properties:
            kind: { type: string, enum: [render, preview] }
            hasDocument: { type: boolean, description: "The PDF is kept: /v1/documents/{runId} returns it" }
            templateId: { $ref: '#/components/schemas/TemplateId' }
            version: { type: [integer, 'null'], description: null for draft previews }
            draftRevision: { type: [integer, 'null'] }
            caller:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [user, api-key] }
                id: { type: string }
                name: { type: string }
            requestId: { type: [string, 'null'] }
            durationMs: { type: [integer, 'null'] }
            provenance:
              type: object
              description: No params or data are stored, only their hashes
              properties:
                templateSha256: { type: string }
                paramsSha256: { type: string }
                dataSha256: { type: string }
                engineVersion: { type: string }
                engineImage: { type: string }
                fonts:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      sha256: { type: string }
                options: { type: object, additionalProperties: { type: string } }
                outputSha256: { type: [string, 'null'] }
                engineTrace: { type: [string, 'null'] }
            problems: { type: array, items: { $ref: '#/components/schemas/ValidationProblem' } }

    DocumentSummary:
      type: object
      required: [runId, createdAt, templateId, version, caller, filename, pages, params, tags]
      properties:
        runId: { type: string }
        createdAt: { type: string, format: date-time }
        templateId: { $ref: '#/components/schemas/TemplateId' }
        version: { type: [integer, 'null'] }
        caller:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [user, api-key] }
            id: { type: string }
            name: { type: [string, 'null'] }
        filename: { type: string }
        pages: { type: [integer, 'null'] }
        params: { type: object, description: The params the caller sent (decimals as decimal strings) }
        tags: { $ref: '#/components/schemas/TagNames' }

    RunRetention:
      type: object
      required: [days]
      properties:
        days: { type: [integer, 'null'], description: null means runs are kept for ever (the default) }
        setBy: { type: [string, 'null'] }
        setAt: { type: [string, 'null'], format: date-time }
        wouldDelete: { type: [integer, 'null'], description: Only with previewDays }
        wouldDeleteDocuments:
          type: [integer, 'null']
          description: Only with previewDays; stored PDFs among the runs that would be deleted

    PreparedData:
      type: object
      description: data-prep's view model; every Decimal is a decimal string
      required: [params, data, lists, totals, problems]
      properties:
        params: { type: object, additionalProperties: true }
        data: {}
        lists:
          type: object
          additionalProperties:
            type: object
            required: [rows, groups]
            properties:
              rows: { type: array, items: { type: object, additionalProperties: true } }
              groups:
                type: array
                items:
                  type: object
                  required: [key, rows, totals]
                  properties:
                    key: {}
                    rows: { type: array, items: { type: object, additionalProperties: true } }
                    totals: { type: object, additionalProperties: { type: string } }
        totals: { type: object, additionalProperties: { type: string } }
        problems:
          type: array
          description: Warnings only (errors are a 422)
          items: { $ref: '#/components/schemas/ValidationProblem' }

    ThemeId:
      type: string
      description: '`mahasamut` (the default), `classic` and `suriyan` are built in; themes made in Studio get a UUID'
      pattern: '^[a-z0-9-]{1,64}$'
    ThemeTokens:
      type: object
      description: |
        The only things a theme can set. The server checks every value against these rules, and Studio
        checks again before a value reaches CSS; raw CSS is never accepted.
      additionalProperties: false
      required: [color.background, color.surface, color.surfaceAlt, color.border, color.text, color.textMuted, color.primary, color.onPrimary, color.danger, color.warning, color.success, font.family, font.size, radius, shadow, density]
      properties:
        color.background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.surface: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.surfaceAlt: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.border: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.text: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.textMuted: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.primary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.onPrimary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.danger: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.warning: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color.success: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        font.family: { type: string, enum: [TH Sarabun New, Sarabun, Noto Sans Thai, system-ui] }
        font.size: { type: integer, minimum: 12, maximum: 18 }
        radius: { type: integer, minimum: 0, maximum: 16 }
        shadow: { type: string, enum: [none, soft, strong] }
        density: { type: string, enum: [compact, comfortable] }
    ThemeInput:
      type: object
      required: [name, tokens]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
    Theme:
      type: object
      required: [id, name, builtIn, tokens]
      properties:
        id: { $ref: '#/components/schemas/ThemeId' }
        name: { type: string }
        builtIn: { type: boolean }
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
        createdBy: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }

    Health:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [up, degraded, down] }
        version: { type: string, description: 'Release of this API (e.g. 1.14.0); Studio shows it in its footer. Left out when the package metadata is not installed (a source checkout).' }
        components:
          type: object
          properties:
            database: { type: string, enum: [up, down] }
            objectStorage: { type: string, enum: [up, down] }
            engine:
              type: object
              properties:
                status: { type: string, enum: [up, down] }
                version: { type: [string, 'null'] }
