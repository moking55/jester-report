  /v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Documents successful renders of published versions produced, newest first (Studio sessions only)
      description: |
        `q` matches any text in the params, the data or the tags, case-insensitively; `%` and `_` are
        ordinary characters. Documents are deleted with their run (see /v1/runs/retention).
      parameters:
        - { name: templateId, in: query, schema: { $ref: '#/components/schemas/TemplateId' } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: Cursor from the previous page, schema: { type: string } }
        - $ref: '#/components/parameters/TagFilter'
      responses:
        '200':
          description: Documents, newest first
          content:
            application/json:
              example:
                items:
                - runId: 019aa61f3c207d3e8a91c0
                  createdAt: '2026-11-20T09:15:00Z'
                  templateId: quotation
                  version: 3
                  caller:
                    type: api-key
                    id: b1d2e3f4-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: ERP production
                  filename: Q-DEMO-001.pdf
                  pages: 2
                  params:
                    quoteId: Q-DEMO-001
                    locale: th-TH
                    docDate: '2026-11-12'
                  tags:
                  - ขาย
                next: null
              schema:
                type: object
                required: [items, next]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
                  next: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/documents/{runId}/tags:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    put:
      tags: [documents]
      operationId: setDocumentTags
      summary: Replace the tags of an issued document (Studio sessions only)
      description: |
        Same rules as `setTemplateTags`. The PDF and everything else stay as issued. API keys can give
        tags when they render but cannot change them afterwards.
      requestBody:
        required: true
        content:
          application/json:
            example:
              tags:
              - ขาย
              - ส่งแล้ว
            schema: { $ref: '#/components/schemas/TagList' }
      responses:
        '200':
          description: The tags after normalising
          content:
            application/json:
              example:
                tags:
                - ขาย
                - ส่งแล้ว
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/documents/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      tags: [documents]
      operationId: getDocument
      description: The stored PDF of a render of a published version, byte for byte; previews are not stored.
      summary: The exact PDF a render returned (Studio sessions only)
      responses:
        '200':
          description: PDF
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''''<filename>` with the name the render returned'
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/runs/retention:
    get:
      tags: [runs]
      operationId: getRunRetention
      summary: How long runs are kept; optionally how many a policy would delete
      description: |
        By default runs are kept for ever. Nothing is deleted until someone sets a policy here.
        `previewDays` counts the runs older than that many days without deleting anything, so
        Studio can show the effect before the user confirms.
      parameters:
        - { name: previewDays, in: query, schema: { type: integer, minimum: 1, maximum: 36500 } }
      responses:
        '200':
          description: Current policy (and preview count when asked)
          content:
            application/json:
              example:
                days: 365
                setBy: somchai
                setAt: '2026-11-20T09:15:00Z'
                wouldDelete: 1280
                wouldDeleteDocuments: 1105
              schema: { $ref: '#/components/schemas/RunRetention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }
    put:
      tags: [runs]
      operationId: setRunRetention
      description: Runs older than `days` (and their stored PDFs) are deleted from now on, in the background. `null` keeps everything.
      summary: Keep runs for N days (older ones are deleted from now on), or for ever with null
      requestBody:
        required: true
        content:
          application/json:
            example:
              days: 365
            schema:
              type: object
              required: [days]
              additionalProperties: false
              properties:
                days: { type: [integer, 'null'], minimum: 1, maximum: 36500 }
      responses:
        '200':
          description: Policy saved
          content:
            application/json:
              example:
                days: 365
                setBy: somchai
                setAt: '2026-11-20T09:15:00Z'
                wouldDelete: null
                wouldDeleteDocuments: null
              schema: { $ref: '#/components/schemas/RunRetention' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/themes:
    get:
      tags: [themes]
      operationId: listThemes
      description: Themes colour Studio only; they never change a PDF.
      summary: Every theme, the two built-in ones first
      responses:
        '200':
          description: Themes
          content:
            application/json:
              example:
              - id: mahasamut
                name: มหาสมุทร
                builtIn: true
                tokens: &id001
                  color.background: '#f5f7fa'
                  color.surface: '#ffffff'
                  color.surfaceAlt: '#eef2f7'
                  color.border: '#d0d7e2'
                  color.text: '#1d2733'
                  color.textMuted: '#5b6b7f'
                  color.primary: '#0b6bcb'
                  color.onPrimary: '#ffffff'
                  color.danger: '#c62828'
                  color.warning: '#b26a00'
                  color.success: '#2e7d32'
                  font.family: Sarabun
                  font.size: 14
                  radius: 6
                  shadow: soft
                  density: comfortable
                createdBy: null
                updatedAt: null
              - id: 6d1f0b9e-2c4a-4e8b-9f3d-1a2b3c4d5e6f
                name: สีองค์กร
                builtIn: false
                tokens: *id001
                createdBy: somchai
                updatedAt: '2026-11-20T09:15:00Z'
              schema: { type: array, items: { $ref: '#/components/schemas/Theme' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [themes]
      operationId: createTheme
      description: A theme is a name plus the fixed set of tokens; every value is checked, raw CSS is never accepted. At most 50 themes.
      summary: Create a theme (also used by Studio's JSON import)
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: สีองค์กร
              tokens:
                color.background: '#f5f7fa'
                color.surface: '#ffffff'
                color.surfaceAlt: '#eef2f7'
                color.border: '#d0d7e2'
                color.text: '#1d2733'
                color.textMuted: '#5b6b7f'
                color.primary: '#0b6bcb'
                color.onPrimary: '#ffffff'
                color.danger: '#c62828'
                color.warning: '#b26a00'
                color.success: '#2e7d32'
                font.family: Sarabun
                font.size: 14
                radius: 6
                shadow: soft
                density: comfortable
            schema: { $ref: '#/components/schemas/ThemeInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              example:
                id: 6d1f0b9e-2c4a-4e8b-9f3d-1a2b3c4d5e6f
                name: สีองค์กร
                builtIn: false
                tokens:
                  color.background: '#f5f7fa'
                  color.surface: '#ffffff'
                  color.surfaceAlt: '#eef2f7'
                  color.border: '#d0d7e2'
                  color.text: '#1d2733'
                  color.textMuted: '#5b6b7f'
                  color.primary: '#0b6bcb'
                  color.onPrimary: '#ffffff'
                  color.danger: '#c62828'
                  color.warning: '#b26a00'
                  color.success: '#2e7d32'
                  font.family: Sarabun
                  font.size: 14
                  radius: 6
                  shadow: soft
                  density: comfortable
                createdBy: somchai
                updatedAt: '2026-11-20T09:15:00Z'
              schema: { $ref: '#/components/schemas/Theme' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A theme with that name exists, or there are already 50 themes
          content:
            application/problem+json:
              example:
                type: https://jester-report.dev/errors/conflict
                title: Conflict
                status: 409
                code: CONFLICT
                detail: a theme named สีองค์กร exists
                retryable: false
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/InputInvalid' }

  /v1/tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: Tags in use on templates or documents, with colour and counts (Studio sessions only)
      description: |
        Busiest first (templates + documents), then by name; every tag in use, since the colours come from this list. Colour belongs to the tag name,
        so it is the same everywhere. A tag nobody has set a colour for is `gray`.
      responses:
        '200':
          description: Tags in use
          content:
            application/json:
              example:
              - tag: ขาย
                color: green
                templates: 3
                documents: 412
              - tag: ไตรมาส 4
                color: gray
                templates: 0
                documents: 37
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagUse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/tag-colors:
    put:
      tags: [tags]
      operationId: setTagColor
      summary: Set the colour of a tag name (Studio sessions only)
      description: |
        The colour applies to every template and document carrying that tag. `gray` removes the colour
        (gray is the default). A tag nobody carries yet can be coloured; the colour is kept for when it is used.
      requestBody:
        required: true
        content:
          application/json:
            example:
              tag: ขาย
              color: green
            schema: { $ref: '#/components/schemas/TagColor' }
      responses:
        '200':
          description: The tag (normalised) and its colour
          content:
            application/json:
              example:
                tag: ขาย
                color: green
              schema: { $ref: '#/components/schemas/TagColor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InputInvalid' }

