[project]
name = "jester-api"
version = "1.1.0"
description = "Jester Report Server API"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "fastapi>=0.115",
  "fonttools>=4.50",
  "httpx>=0.27",
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "pypdf>=7.0.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jester_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "engine: needs a real Gotenberg at GOTENBERG_URL",
  "db: needs PostgreSQL at JESTER_TEST_DATABASE_URL",
  "storage: needs S3-compatible storage at JESTER_TEST_S3_ENDPOINT",
  "live_stack: needs the whole compose stack at JESTER_TEST_API_URL",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
